<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script>
/* The archive is Persian first, so the very first paint is too. This runs
   before anything is drawn; i18n.js takes over once it loads. */
(function () {
  var langs = ['fa', 'en'];
  var chosen = null;
  try { chosen = localStorage.getItem('nm_lang'); } catch (e) { /* storage blocked */ }
  var asked = new URLSearchParams(location.search).get('lang');
  var lang = langs.indexOf(asked) >= 0 ? asked : (langs.indexOf(chosen) >= 0 ? chosen : 'fa');
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
}());
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.404">پیدا نشد — یاد آر</title>
<link rel="icon" type="image/png" href="/img/icon-32.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand__mark">
      <!-- The archive's mark. The pin below stands in only if it fails to load. -->
      <img class="brand__logo" src="/img/logo.png" alt=""
           onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()">
      <svg class="brand__pin" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="10" r="2.4" fill="currentColor"/>
      </svg>
    </span>
    <span data-i18n="brand.name">نامه‌های ایرانی نو</span>
  </a>
  <nav class="site-nav">
    <a href="/" data-i18n="nav.map">نقشۀ روایات</a>
    <a href="/submit"><span data-i18n="nav.submitShort">ثبت</span> <span class="nav-long" data-i18n="nav.submitRest">روایت</span></a>
    <!-- About is hidden until the page is written. Uncomment the line below and
         set SHOW_ABOUT=true to bring it back.
    <a href="/about" data-i18n="nav.about">درباره</a> -->
  </nav>
</header>
<main class="page" style="text-align:center;padding-top:16vh">
  <h1 class="page__title" data-i18n="404.title">در این نشانی چیزی نیست.</h1>
<p class="page__lede" style="margin-left:auto;margin-right:auto" data-i18n="404.body">صفحه‌ای که دنبالش بودید اینجا نیست. اما نقشه سر جایش است.</p>
  <a class="btn btn--primary" href="/" data-i18n="404.back">بازگشت به نقشه</a>
</main>
<script src="/js/i18n.js"></script>
</body>
</html>
