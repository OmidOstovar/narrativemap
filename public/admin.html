<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script>
/* The archive is Persian first, so the very first paint is too. This runs
   before anything is drawn; i18n.js takes over once it loads. */
(function () {
  var langs = ['fa', 'en'];
  var chosen = null;
  try { chosen = localStorage.getItem('nm_lang'); } catch (e) { /* storage blocked */ }
  var asked = new URLSearchParams(location.search).get('lang');
  var lang = langs.indexOf(asked) >= 0 ? asked : (langs.indexOf(chosen) >= 0 ? chosen : 'fa');
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
}());
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.admin">صف بررسی — نامه‌های ایرانی</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/img/icon-32.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="/">
    <span class="brand__mark">
      <!-- The archive's mark. The pin below stands in only if it fails to load. -->
      <img class="brand__logo" src="/img/logo.png" alt=""
           onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()">
      <svg class="brand__pin" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="10" r="2.4" fill="currentColor"/>
      </svg>
    </span>
    <span class="brand__line" data-i18n="brand.tagline">ثبت آنچه در دی‌ماه گذشت</span>
    <span class="brand__name" data-i18n="brand.name">نامه‌های ایرانی نو</span>
    <span class="brand__sub" data-i18n="admin.brandSub">صف بررسی</span>
  </a>
  <nav class="site-nav">
    <a href="/" data-i18n="nav.publicMap">نقشهٔ عمومی</a>
    <button type="button" class="btn btn--ghost btn--sm" id="logout" data-i18n="admin.signOut" hidden>خروج</button>
  </nav>
</header>

<div id="login-view" hidden>
  <div class="login-box">
    <h1 data-i18n="admin.title">صف بررسی</h1>
    <p data-i18n="admin.loginNote">برای خواندن روایت‌های رسیده و تصمیم دربارهٔ انتشارشان وارد شوید.</p>
    <form id="login-form">
      <div class="field">
        <label class="field__label" for="password" data-i18n="admin.password">گذرواژه</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <p class="field__error" id="login-error"></p>
      </div>
      <button type="submit" class="btn btn--primary btn--block" data-i18n="admin.signIn">ورود</button>
    </form>
  </div>
</div>

<main class="admin-shell" id="admin-view" hidden>
  <aside class="admin-queue">
    <div class="tabs" id="tabs">
      <button type="button" class="tab is-active" data-status="pending"><span data-i18n="admin.tab.pending">در انتظار</span> <span class="count" data-count="pending">0</span></button>
      <button type="button" class="tab" data-status="approved"><span data-i18n="admin.tab.approved">منتشرشده</span> <span class="count" data-count="approved">0</span></button>
      <button type="button" class="tab" data-status="rejected"><span data-i18n="admin.tab.rejected">ردشده</span> <span class="count" data-count="rejected">0</span></button>
    </div>
    <ul class="narrative-list" id="queue"></ul>
  </aside>

  <section class="admin-detail" id="detail">
    <div class="empty-state" style="padding-top:20vh">
      <strong data-i18n="admin.nothingSelected">چیزی انتخاب نشده.</strong>
      <span data-i18n="admin.pickOne">برای خواندن، یکی از روایت‌های صف را انتخاب کنید.</span>
    </div>
  </section>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/jalali.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/map-base.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
