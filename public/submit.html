<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.submit">Add your narrative — Narrative Map</title>
<meta name="description" content="Submit a narrative to the map of Iran. Answer a short set of questions, mark the exact place, and give the period it belongs to.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📍</text></svg>">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="/">
    <svg class="brand__mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="10" r="2.4" fill="currentColor"/>
    </svg>
    <span data-i18n="brand.name">Narrative Map</span>
    <span class="brand__sub" data-i18n="brand.sub">Iran</span>
  </a>
  <nav class="site-nav">
    <a href="/" data-i18n="nav.map">Map</a>
    <a href="/submit"><span data-i18n="nav.submitShort">Add</span> <span class="nav-long" data-i18n="nav.submitRest">your narrative</span></a>
    <a href="/about" data-i18n="nav.about">About</a>
  </nav>
</header>

<main class="page" id="page">
  <p class="page__eyebrow" data-i18n="submit.eyebrow">Add a narrative</p>
  <h1 class="page__title" data-i18n="submit.title">Yaad Aar</h1>
  <div class="manifesto">
    <p data-i18n="manifesto.p1"></p>
    <p data-i18n="manifesto.p2"></p>
    <p data-i18n="manifesto.p3"></p>
  </div>

  <div class="progress" id="progress" hidden>
    <div class="progress__bar"><div class="progress__fill" id="progress-fill"></div></div>
    <div class="progress__text">
      <span id="progress-text" data-i18n="submit.progress.none">Nothing answered yet</span>
      <span id="progress-required"></span>
    </div>
  </div>

  <!-- Every step is rendered from FORM_SEQUENCE so the order and the numbering
       stay in step with the questionnaire and with the Telegram bot. -->
  <form id="form" novalidate>
    <div id="steps"></div>

    <div class="callout" id="form-error" hidden></div>

    <div class="submit-actions">
      <button type="submit" class="btn btn--primary" id="submit-btn" data-i18n="submit.send">Send for review</button>
      <span class="note" data-i18n="submit.moderatorNote">A moderator reads every submission before it is published.</span>
    </div>
  </form>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/jalali.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/map-base.js"></script>
<script src="/js/submit.js"></script>
</body>
</html>
